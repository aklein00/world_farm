<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Six renders from the WorldFarm market building kit.">
  <title>WorldFarm — Market Sample Images</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="samples.css">
</head>
<body>
  <header class="masthead">
    <a href="../../" class="brand"><span aria-hidden="true">▥</span> WORLDFARM</a>
    <a href="../">Interactive models ↗</a>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">MARKET KIT 01 / SAMPLE IMAGES</p>
      <h1>Six market styles.</h1>
      <p class="lede">Blender renders of the revised WorldFarm market buildings. Select any image to open it at full size.</p>
    </section>
    <nav class="toolbar sample-links" aria-label="More views">
      <a href="../">Explore all 12 models in 3D ↗</a>
      <a href="images/all-twelve-models.png">See all 12 in one image ↗</a>
    </nav>
    <section class="samples" aria-label="Market renders">
      <figure class="pair">
        <a href="images/04C-blender.png"><img src="images/04C-blender.png" width="900" height="900" alt="Peach Modern market with three raised roof beams and a planter over a pink striped awning"></a>
        <figcaption class="pair-heading"><span class="style-code">04.C</span><strong>Peach Modern</strong></figcaption>
      </figure>
      <figure class="pair">
        <a href="images/04D-blender.png"><img src="images/04D-blender.png" width="900" height="900" alt="Rose Twilight market with lit upper windows, a long planter and a rose-colored roof cap"></a>
        <figcaption class="pair-heading"><span class="style-code">04.D</span><strong>Rose Twilight</strong></figcaption>
      </figure>
      <figure class="pair">
        <a href="images/03B-blender.png"><img src="images/03B-blender.png" width="900" height="900" loading="lazy" alt="Honey Corners market with full-height corner piers, large roof caps and a clay hip roof"></a>
        <figcaption class="pair-heading"><span class="style-code">03.B</span><strong>Honey Corners</strong></figcaption>
      </figure>
      <figure class="pair">
        <a href="images/03A-blender.png"><img src="images/03A-blender.png" width="900" height="900" loading="lazy" alt="Soft Blocks market with rounded walls, a continuous rounded roof rim and a peach awning"></a>
        <figcaption class="pair-heading"><span class="style-code">03.A</span><strong>Soft Blocks</strong></figcaption>
      </figure>
      <figure class="pair">
        <a href="images/01D-blender.png"><img src="images/01D-blender.png" width="900" height="900" loading="lazy" alt="Copper Rooftops market with tall windows and a low copper pavilion on a planted roof terrace"></a>
        <figcaption class="pair-heading"><span class="style-code">01.D</span><strong>Copper Rooftops</strong></figcaption>
      </figure>
      <figure class="pair">
        <a href="images/02D-blender.png"><img src="images/02D-blender.png" width="900" height="900" loading="lazy" alt="Amber Afterglow market with warm lit windows, a shallow faceted roof and two vents"></a>
        <figcaption class="pair-heading"><span class="style-code">02.D</span><strong>Amber Afterglow</strong></figcaption>
      </figure>
    </section>
  </main>
  <footer>WORLDFARM · MARKET KIT 01</footer>
